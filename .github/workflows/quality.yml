name: Release quality

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Code quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci --strict-allow-scripts

      - name: Run release verification
        run: npm run verify:release

      - name: Build all production routes
        run: npm run build

  browser-smoke:
    name: Responsive browser and accessibility
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci --strict-allow-scripts

      - name: Install Chrome for Playwright
        run: npx playwright install chrome

      - name: Run phone, tablet and desktop journeys
        run: npm run test:e2e

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Scan tracked source and Git history
        run: npm run security:source

      - name: Fail on known dependency vulnerabilities
        run: npm run security:audit

      - name: Verify npm registry signatures and attestations
        run: npm run security:signatures
