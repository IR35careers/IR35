name: Release quality

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  sdk-gate:
    name: Private Caddy SDK ordering regression
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Public synthetic constants only. No Actions/cloud/app credentials are
      # passed to these internal-network containers; no ports are published.
      - name: Reproduce frozen defect, test literal SDK route, verify evidence
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d)
          evidence_root=$(mktemp -d)
          python3 infra/oracle/sdk_gate_private.py --mode baseline --root "$fixture_root" --export "$evidence_root"
          python3 infra/oracle/sdk_gate_private.py --mode fixed --root "$fixture_root" --export "$evidence_root"
          python3 infra/oracle/sdk_gate_proof.py --root "$evidence_root" --attempt 1

  oracle-key-safety:
    name: Oracle local key custody tests
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install isolated key-test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ir35-key-tests"
          "$RUNNER_TEMP/ir35-key-tests/bin/python" -m pip install -r infra/oracle/key-requirements.txt
      - name: Test local encryption, refusal and redaction with disposable mock keys
        run: |
          "$RUNNER_TEMP/ir35-key-tests/bin/python" -m unittest discover -s infra/oracle/tests -v

  worker-standby:
    name: Worker Docker build and Postgres standby health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build pinned Chromium worker
        run: docker build -f services/application-worker/Dockerfile -t ir35-worker:ci .
      - name: Prepare isolated CI queues
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < tests/fixtures/queue/roles.sql
          docker run --rm --network host -e NODE_ENV=test -e PG_BOSS_LOCAL_TEST=true \
            -e PG_BOSS_DATABASE_URL=postgresql://ir35_queue:ci-only-queue-owner@127.0.0.1:5432/postgres \
            --entrypoint node ir35-worker:ci --import tsx services/application-worker/setup-queue.ts
          docker exec -i "$POSTGRES_CONTAINER" psql -U ir35_queue -d postgres -v ON_ERROR_STOP=1 < supabase/operations/pgboss-producer-grants.sql
      - name: Verify separate producer and queue-only owner permissions
        run: |
          docker run --rm --network host -e NODE_ENV=test -e PG_BOSS_LOCAL_TEST=true \
            -e PG_BOSS_DATABASE_URL=postgresql://ir35_queue:ci-only-queue-owner@127.0.0.1:5432/postgres \
            -e PG_BOSS_PRODUCER_TEST_DATABASE_URL=postgresql://ir35_queue_producer:ci-only-queue-producer@127.0.0.1:5432/postgres \
            --entrypoint node ir35-worker:ci --import tsx services/application-worker/verify-queue-permissions.ts
      - name: Boot standby without application credentials or consumers
        run: |
          docker run -d --name ir35-worker-standby --network host \
            -e NODE_ENV=test -e PG_BOSS_LOCAL_TEST=true \
            -e PG_BOSS_DATABASE_URL=postgresql://ir35_queue:ci-only-queue-owner@127.0.0.1:5432/postgres \
            -e APPLY_RUNNER=railway -e APPLICATION_WORKER_ACCEPT_JOBS=false \
            -e APPLICATION_WORKER_SECRET=mock-ci-signing-key-not-a-live-credential \
            -e IR35CAREERS_APP_URL=https://mock.example.test ir35-worker:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/health > /tmp/ir35-worker-health.json; then
              node -e "const h=require('/tmp/ir35-worker-health.json');if(!h.ok||!h.browserReady||!h.databaseReady||h.mode!=='standby'||h.active!==0)process.exit(1)"
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Print redacted standby diagnostics and stop container
        if: always()
        run: |
          docker logs ir35-worker-standby 2>&1 || true
          docker rm -f ir35-worker-standby 2>/dev/null || true

  quality:
    name: Code quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci --strict-allow-scripts

      - name: Run release verification
        run: npm run verify:release

      - name: Build all production routes
        run: npm run build

  browser-smoke:
    name: Responsive browser and accessibility (${{ matrix.project }})
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-chrome, tablet-chrome, desktop-chrome]
    env:
      IR35CAREERS_E2E_DEMO_DATA: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci --strict-allow-scripts

      - name: Install version-pinned Chromium for Playwright
        run: npx playwright install chromium

      - name: Run phone, tablet and desktop journeys
        run: npm run test:e2e -- --project ${{ matrix.project }}

      - name: Upload failure evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Dependency and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Use reproducible npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Scan tracked source and Git history
        run: npm run security:source

      - name: Fail on known dependency vulnerabilities
        run: npm run security:audit

      - name: Verify npm registry signatures and attestations
        run: npm run security:signatures
