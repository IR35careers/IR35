name: Bot label and result sync

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review]
  issues:
    types: [opened, edited, labeled]
  workflow_run:
    workflows: [PR checks]
    types: [completed]

permissions: {}

concurrency:
  group: bot-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name != 'workflow_run' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Never check out or execute the pull_request_target head.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name == 'pull_request_target'
        run: node --import tsx scripts/bots/cli.ts sync-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name == 'issues'
        run: node --import tsx scripts/bots/cli.ts sync-issue
        env:
          GITHUB_TOKEN: ${{ github.token }}

  results:
    if: github.event_name == 'workflow_run' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Read validated run/job metadata only. Never download/execute PR artifacts.
      - run: node --import tsx scripts/bots/cli.ts report-checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
